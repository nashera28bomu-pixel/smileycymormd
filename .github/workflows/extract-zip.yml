name: Extract bot zip

on:
  push:
    paths:
      - "SMILEY-CYMOR-MD-bot.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the zip exists
        run: |
          test -f SMILEY-CYMOR-MD-bot.zip || { echo "SMILEY-CYMOR-MD-bot.zip not found in repo root"; exit 1; }

      - name: Extract and flatten
        run: |
          rm -rf /tmp/bot && mkdir /tmp/bot
          unzip -q SMILEY-CYMOR-MD-bot.zip -d /tmp/bot
          # contents of smiley-cymor-md/ go to the repo root (app.json must be at the root for Heroku)
          cp -a /tmp/bot/smiley-cymor-md/. .
          [ -f /tmp/bot/GO-LIVE.md ] && cp /tmp/bot/GO-LIVE.md .
          rm -f SMILEY-CYMOR-MD-bot.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "Extract SMILEY CYMOR MD bot [skip ci]"
          git push
